name: Bug report
description: Tell us what did not work in LazyCall.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Privacy:** do not attach real meeting recordings, transcript excerpts, screenshots containing private content, tokens, API keys, or source code from a private project. Use a minimal synthetic example instead.
  - type: input
    id: version
    attributes:
      label: LazyCall version
      placeholder: "For example: 0.3.5"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was LazyCall installed?
      options:
        - Web installer
        - Full installer
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and hardware
      description: Include Windows version, CPU/GPU mode, and relevant devices. Do not include user names or paths.
      placeholder: "Windows 11 24H2; NVIDIA CUDA; USB microphone"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal, non-sensitive sequence.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Paste only redacted errors or screenshots made from synthetic data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed meeting content, credentials, private source code, and personal data.
          required: true
