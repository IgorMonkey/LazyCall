name: Prepare release review artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated or lightweight tag, for example v0.3.5
        required: true
        type: string
      ref:
        description: Immutable commit SHA or Git ref that the tag must resolve to
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Build review artifacts on Windows
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify tag, ref, and package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Tag must be v<semantic-version>' }
          $version = node -p "require('./package.json').version"
          node scripts/check-release-policy.cjs --tag $env:RELEASE_TAG
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match package version $version" }
          $head = git rev-parse HEAD
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          if (-not $tagCommit) { throw "Tag $env:RELEASE_TAG does not resolve to a commit" }
          if ($head -ne $tagCommit) { throw "Requested ref $head does not match tag $env:RELEASE_TAG at $tagCommit" }
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack yarn --version
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Build
        run: corepack yarn build
      - name: Test
        run: corepack yarn test
      - name: Download pinned speech runtime for public staging
        run: corepack yarn setup:whisper
      - name: Build and smoke-test public stage
        shell: pwsh
        env:
          CALLME_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack yarn pack:public
          New-Item -ItemType Directory -Force 'test-results' | Out-Null
          Copy-Item 'tests/fixtures/speech-ru-16k.wav' 'test-results/speech-16k.wav' -Force
          $env:CALLME_PACKAGED_EXE = (Resolve-Path 'release/public-review/win-unpacked/LazyCall.exe').Path
          $env:CALLME_PUBLIC_LIGHT = '1'
          node scripts/check-packaged.cjs
      - name: Build web and full installer review artifacts
        shell: pwsh
        env:
          CALLME_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack yarn dist:web --prepackaged release/public-review/win-unpacked --full-installer
      - name: Create artifact checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $files = Get-ChildItem 'release/web-installer' -Recurse -File
          if ($files.Count -eq 0) { throw 'No web installer artifacts were created' }
          $sums = $files | Sort-Object FullName | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring((Get-Location).Path.Length + 1).Replace('\','/'))" }
          Set-Content -Path 'release/web-installer/SHA256SUMS.txt' -Value $sums -Encoding utf8
          Get-Content 'release/web-installer/SHA256SUMS.txt'
      - name: Upload review artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lazycall-release-review-${{ inputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/public-review/public-stage.json
            release/web-installer/**
            test-results/packaged-check.json
            test-results/packaged-smoke.png
