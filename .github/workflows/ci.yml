name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Build and test on Windows
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack yarn --version
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Check version and PR title
        run: node scripts/check-release-policy.cjs
      - name: Build
        run: corepack yarn build
      - name: Test
        run: corepack yarn test
      - name: Check microphone selection and permissions
        run: node scripts/check-microphones.cjs
      - name: Check responsive header, onboarding and workspace alignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/check-assistant-ui.cjs --header
          node scripts/check-assistant-ui.cjs --onboarding
          node scripts/check-assistant-ui.cjs --spacing
