name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Build and test on Windows
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check version and PR title
        run: node scripts/check-release-policy.cjs
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test
      - name: Check responsive header and onboarding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/check-assistant-ui.cjs --header
          node scripts/check-assistant-ui.cjs --onboarding
